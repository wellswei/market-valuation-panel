name: Daily Market Valuation Panel

on:
  schedule:
    # 17:30 America/New_York on standard time. During EDT this is 18:30.
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Quote date (YYYY-MM-DD); default is the New York dispatch date"
        required: false
      max_per_market:
        description: "Maximum accepted symbols per market; 0 means full available universe"
        required: false
        default: "0"
      sleep_seconds:
        description: "Delay between ticker valuation requests"
        required: false
        default: "0.2"

permissions:
  actions: read
  contents: write

concurrency:
  group: daily-market-valuation-panel
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      MAX_PER_MARKET: ${{ github.event.inputs.max_per_market || '0' }}
      SLEEP_SECONDS: ${{ github.event.inputs.sleep_seconds || '0.2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Refresh valuation panel
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          date_args=()
          if [[ -n "$DISPATCH_DATE" ]]; then
            date_args=(--date "$DISPATCH_DATE")
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            created_at=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)
            date_args=(--date "$(TZ=America/New_York date -d "$created_at" +%F)")
          fi
          market-valuation-panel refresh "${date_args[@]}" \
            --max-per-market "$MAX_PER_MARKET" \
            --sleep-seconds "$SLEEP_SECONDS" \
            --output-dir data/market_valuation

      - name: Commit updated panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_valuation
          if git diff --cached --quiet; then
            echo "No valuation panel changes to commit."
          else
            git commit -m "Update market valuation panel"
            git pull --rebase origin main
            git push
          fi
