name: Daily Market Valuation Panel

on:
  schedule:
    # GitHub cron is UTC. These off-peak entries cover 17:07-19:07 New York
    # in EDT and EST. The job gates on the scheduled New York time and skips
    # after the first success.
    - cron: "7 21 * * *"
    - cron: "37 21 * * *"
    - cron: "7 22 * * *"
    - cron: "37 22 * * *"
    - cron: "7 23 * * *"
    - cron: "37 23 * * *"
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      max_per_market:
        description: "Maximum accepted symbols per market; 0 means full available universe"
        required: false
        default: "0"

permissions:
  actions: read
  contents: write

concurrency:
  group: daily-market-valuation-panel
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      MAX_PER_MARKET: ${{ github.event.inputs.max_per_market || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check retry window
        id: retry-window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cron_minute="$(echo "${{ github.event.schedule }}" | awk '{print $1}')"
          cron_hour="$(echo "${{ github.event.schedule }}" | awk '{print $2}')"
          scheduled_local="$(
            TZ=America/New_York date -d "$(date -u +%F) ${cron_hour}:${cron_minute} UTC" "+%F %H %M"
          )"
          ny_date="$(echo "$scheduled_local" | awk '{print $1}')"
          ny_hour="$(echo "$scheduled_local" | awk '{print $2}')"
          ny_minute="$(echo "$scheduled_local" | awk '{print $3}')"
          if [ "$ny_hour" -lt 17 ] || [ "$ny_hour" -gt 19 ] || { [ "$ny_hour" -eq 19 ] && [ "$ny_minute" -gt 7 ]; }; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled New York time ${ny_date} ${ny_hour}:${ny_minute} is outside the retry window."
            exit 0
          fi

          window_start="$(TZ=America/New_York date -d "$ny_date 17:00" -u +%Y-%m-%dT%H:%M:%SZ)"
          current_run="${{ github.run_id }}"
          prior_success="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=schedule&status=success&per_page=50" \
              --jq '.workflow_runs[]
                | select(.name == "Daily Market Valuation Panel")
                | select(.created_at >= "'"$window_start"'")
                | select((.id | tostring) != "'"$current_run"'")
                | .id' \
              | head -n 1
          )"

          if [ -n "$prior_success" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "A scheduled refresh already succeeded today: $prior_success"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.retry-window.outputs.should_run == 'true'
        with:
          python-version: "3.12"

      - name: Install package
        if: steps.retry-window.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Refresh valuation panel
        if: steps.retry-window.outputs.should_run == 'true'
        run: |
          market-valuation-panel refresh \
            --max-per-market "$MAX_PER_MARKET" \
            --sleep-seconds 0.5 \
            --output-dir data/market_valuation

      - name: Commit updated panel
        if: steps.retry-window.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_valuation
          if git diff --cached --quiet; then
            echo "No valuation panel changes to commit."
          else
            git commit -m "Update market valuation panel"
            git push
          fi
