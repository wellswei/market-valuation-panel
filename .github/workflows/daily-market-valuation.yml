name: Daily Market Valuation Panel

on:
  schedule:
    # 09:30 UTC. Adjust as needed; GitHub cron is UTC.
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      max_per_market:
        description: "Maximum accepted symbols per market; 0 means full available universe"
        required: false
        default: "750"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      MAX_PER_MARKET: ${{ github.event.inputs.max_per_market || '750' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Refresh valuation panel
        run: |
          market-valuation-panel refresh \
            --max-per-market "$MAX_PER_MARKET" \
            --sleep-seconds 0.5 \
            --output-dir data/market_valuation

      - name: Commit updated panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_valuation
          if git diff --cached --quiet; then
            echo "No valuation panel changes to commit."
          else
            git commit -m "Update market valuation panel"
            git push
          fi

