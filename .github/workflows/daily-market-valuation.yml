name: Daily Market Valuation Panel

on:
  schedule:
    # GitHub cron is UTC. These cover 17:00 New York in EDT and EST;
    # the job below gates on America/New_York so only the matching run refreshes.
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      max_per_market:
        description: "Maximum accepted symbols per market; 0 means full available universe"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: daily-market-valuation-panel
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      MAX_PER_MARKET: ${{ github.event.inputs.max_per_market || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check New York run hour
        id: ny-hour
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(TZ=America/New_York date +%H)" = "17" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.ny-hour.outputs.should_run == 'true'
        with:
          python-version: "3.12"

      - name: Install package
        if: steps.ny-hour.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Refresh valuation panel
        if: steps.ny-hour.outputs.should_run == 'true'
        run: |
          market-valuation-panel refresh \
            --max-per-market "$MAX_PER_MARKET" \
            --sleep-seconds 0.5 \
            --output-dir data/market_valuation

      - name: Commit updated panel
        if: steps.ny-hour.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_valuation
          if git diff --cached --quiet; then
            echo "No valuation panel changes to commit."
          else
            git commit -m "Update market valuation panel"
            git push
          fi
